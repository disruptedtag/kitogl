name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    name: ${{ matrix.binding }} / Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            binding: PySide6==6.12.0
          - python: "3.8"
            binding: PySide2==5.15.2.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for Qt under Xvfb (Mesa OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install "${{ matrix.binding }}" .
      - name: Tests (no card needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Tests (drawing, Mesa under Xvfb)
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -m unittest discover -s tests -v

  wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/
